<!DOCTYPE html>
<html lang="hu">
<head>
    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="47a95990-d9e5-43bd-94a2-f0a392b7114c" data-blockingmode="auto" type="text/javascript"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adatvédelmi szerződés | TT</title>
    <meta name="description" content="A TT adatvédelmi tájékoztatója.">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="canonical" href="https://www.trefta.com/adatvedelmi/">
    <link rel="stylesheet" href="/index.css">
    <style>
        .doc-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .doc-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 24px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .doc-bar a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .doc-bar span {
            font-family: var(--font-title);
            font-weight: 700;
            color: var(--text-color);
        }

        .doc-frame {
            flex: 1;
            width: 100%;
            min-height: calc(100vh - 56px);
            border: 0;
            background: var(--bg);
        }

        .doc-fallback {
            padding: 40px 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="doc-wrap">
        <header class="doc-bar">
            <a href="/">← Vissza</a>
            <span>Adatvédelmi szerződés</span>
            <a href="/adatvedelmi.pdf">Letöltés</a>
        </header>
        <object class="doc-frame" data="/adatvedelmi.pdf" type="application/pdf">
            <p class="doc-fallback">A dokumentum itt nem jeleníthető meg. <a href="/adatvedelmi.pdf">Megnyitás PDF-ként</a></p>
        </object>
    </div>
</body>
</html>
